software-deployment-method: conda
use-conda: True
cores: 100

rerun-incomplete: True

report: 'report.html'
report-after-run: True

printshellcmds: True

resources:
  job_load_factor: 10

default-resources:
    mem_mb: min(max(2*input.size_mb, 3000) * attempt, 15000)
    runtime: f"{60 * attempt}m"

set-resources:
  downsample_bam_file:
    mem_mb: min((1000 * threads) * attempt, 180000)
    runtime: f"{1440 * attempt}m"
  merge_bam_files:
    mem_mb: min((1000 * threads) * attempt, 180000)
    runtime: f"{1440 * attempt}m"
  cfclone_run_cfclone:
    mem_mb: min((1000 * threads) * attempt, 180000)
    runtime: f"{1440 * attempt}m"
