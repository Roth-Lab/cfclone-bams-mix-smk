$schema: "https://json-schema.org/draft/2020-12/schema"
title: Mix bams cfClone
description: Run cfClone on data generated by mixing bams
type: object
properties:
  out_dir:
    type: string
    minLength: 1
    description: Path to output directory
  pipeline_dir:
    type: string
    minLength: 1
    description: Path to pipeline working directory
  bam_file_template:
    type: string
    minLength: 1
    description: Path to bam files
  read_counts_file_template:
    type: string
    minLength: 1
    description: Path .tsv file with reads of bam files
  control_bam_file_template:
    type: string
    minLength: 1
    description: Path to control bam file i.e. NED cfDNA sample or matched normal
  snp_file_template:
    type: string
    minLength: 1
    description: Path to snp file in .bcf format
  clone_filter_file_template:
    type: string
    minLength: 1
    description: Path to .tsv file specifying which clones to keep
  hapclone_results_file:
    type: string
    minLength: 1
    description: Path to HapClone tsv results file
  black_list_file:
    type: string
    minLength: 1
    description: Path to .bed.gz black list file 
  centromere_file:
    type: string
    minLength: 1
    description: Path to .txt centromere file 
  map_file:
    type: string
    minLength: 1
    description: Path to .bw mappability file
  ref_genome_file:
    type: string
    minLength: 1
    description: Path to .fasta reference genome file
  add_chr_prefix:
    type: boolean
    default: true
    description: if true add chr as prefix to chromosome labels
  bin_size:
    type: string
    default: "500kb"
  min_bqual:
    type: integer
    default: 30
  min_mqual:
    type: integer
    default: 30
  read_length:
    type: integer
    default: 150
    description: Read length of sequencer
  genome_length:
    type: integer
    default: 3000000000
    description: Length of genome 
  patient:
    type: string
    minLength: 1
    description: patient id from which bams were mixed
  mixtures:
    type: object
    description: Dictionary mapping mixture ids to their initial and final samples to mix
    additionalProperties:
      type: object
      properties:
        initial:
          type: string
        final:
          type: string
  coverages:
    type: array
    minItems: 1
    description: List of coverage values to use to generate data
    items:
      type: number
  proportions:
    type: array
    minItems: 1
    description: List of proportions to use to generate data 
    items:
      type: number
  chromosomes:
    type: array
    minItems: 1
    description: List of chromosomes to use to generate data
    items:
      type: string
  num_data_replicates:
    type: integer
    minimum: 1
    default: 1
    description: Number of seeds to use when generate data 
  num_model_replicates:
    type: integer
    minimum: 1
    default: 1
    description: Number of replicates per setting of coverage, tumour content, and data replicate
  num_chains:
    type: integer
    minimum: 1
    default: 2
    description: Number of parallel tempering chains used for reference distribution
  num_rounds:
    type: integer
    minimum: 1
    default: 2
    description: Number of rounds of sampling
  num_threads:
    type: integer
    minimum: 1
    default: 2
    description: Number of threads to use for sampling
  cfclone_use_outlier:
    type: boolean
    default: true
    description: Whether to use outlier model in cfClone

required: [
  "out_dir",
  "pipeline_dir",
  "bam_file_template",
  "read_counts_file_template",
  "snp_file_template",
  "clone_filter_file_template",
  "hapclone_results_file_template",
  "black_list_file",
  "centromere_file",
  "map_file",
  "ref_genome_file",
  "patient",
  "mixtures",
  "coverages",
  "proportions",
  "chromosomes",
]
